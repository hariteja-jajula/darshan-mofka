# Darshan runtime config for the DLIO workload (selected via DARSHAN_CONFIG_PATH,
# set only for WL_TYPE=dlio in lib/run.sh darshan_env()).
#
# WHY: DLIO's `import tensorflow` opens >1024 distinct .pyc/.py files, and
# generate_data=True writes num_files_train (=WL_EVENTS) npz files. Together these
# exceed Darshan's default per-module record cap DARSHAN_DEF_MOD_REC_COUNT=1024
# (darshan/darshan-runtime/lib/darshan.h:232). Once the cap is hit,
# darshan_core_register_record returns NULL and posix_track_new_file_record drops
# every later new-file record (darshan-posix.c:2112) -- and because DARSHAN_MOFKA_SEND
# lives INSIDE the same POSIX_PRE_RECORD gate (darshan-posix.c:259,422), the dropped
# records are absent from BOTH the native .darshan log AND the Mofka stream. That made
# the dlio strict-compare a vacuous PASS.
#
# The record cap is itself bounded by the shared module-memory pool, 4 MiB by default
# (darshan.h:70; this build has __DARSHAN_MOD_MEM_MAX undef, darshan-runtime-config.h:325).
# So MAX_RECORDS alone is silently truncated to pool/rec_size (darshan-core.c:2571) --
# MODMEM MUST be raised too. (Root-caused + cross-checked by two subagents, BX 2026-07-27.)
#
# SIZING: 32768 records covers the TF import (~1-1.5k files) plus up to ~31k npz files.
# MODMEM 64 MiB comfortably holds 32768 POSIX (~720 B) + 32768 STDIO records.
# If STUDY_EVENTS (= num_files_train) approaches ~31000, raise BOTH numbers.
MODMEM 64
MAX_RECORDS 32768 POSIX,STDIO
